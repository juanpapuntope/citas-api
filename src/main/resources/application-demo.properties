# Perfil demo: base H2 en memoria (para Codespaces). Se crea de nuevo cada vez que arranca,
# con las 16 tablas y los mismos datos de prueba de database/citas_db.sql.
spring.datasource.url=jdbc:h2:mem:citas_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql
