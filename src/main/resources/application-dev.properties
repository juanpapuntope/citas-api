# Sin variables de entorno -> XAMPP local (root sin contraseña).
# En Codespaces, los secretos DB_URL, DB_USER y DB_PASSWORD -> Hostinger.
# Nunca escribir aquí la contraseña de Hostinger: este archivo se sube a GitHub.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update