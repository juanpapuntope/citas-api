spring.application.name=citas-api
server.port=8080

# Perfil activo: demo (H2). En la forma 3 se cambia a dev (MySQL).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Errores 400: mostrar el mensaje de cada validación en la respuesta
server.error.include-message=always
server.error.include-binding-errors=always

# Necesario detrás de proxies (Codespaces): Swagger usa la URL https correcta
server.forward-headers-strategy=framework

# Pocas conexiones: Hostinger limita las conexiones por usuario
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Datos de prueba: un archivo por módulo en resources/data/
spring.sql.init.mode=always
spring.sql.init.data-locations=optional:classpath*:data/data-*.sql

# Swagger UI -> /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true