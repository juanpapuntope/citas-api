spring.application.name=citas-api
server.port=8080

# Perfil por defecto: dev (MySQL de XAMPP en tu PC).
# En Codespaces se usa demo (H2 en memoria): lo indica .devcontainer/devcontainer.json
spring.profiles.active=dev

# Mostrar el mensaje de error en las respuestas 400, 401, 403, 404 y 409
server.error.include-message=always
server.error.include-binding-errors=always

# Ver en la consola el SQL que genera JPA
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Las tablas ya existen: Hibernate NO las crea ni las cambia
spring.jpa.hibernate.ddl-auto=none
